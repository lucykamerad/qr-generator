<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>QR Generator</h1>
    <p class="subtitle">Type a link or some text and the code updates as you go.</p>

    <input id="text" type="text" placeholder="Text or URL" aria-label="Text or URL" autocomplete="off" autofocus>

    <div class="options">
      <label>
        Error correction
        <select id="level">
          <option value="L">Low (7%)</option>
          <option value="M">Medium (15%)</option>
          <option value="Q">Quartile (25%)</option>
          <option value="H" selected>High (30%)</option>
        </select>
      </label>

      <div>
        Logo
        <div class="logo">
          <input id="logo-file" type="file" accept="image/*" hidden>
          <button id="logo-add" type="button" aria-label="Add a logo">+</button>
          <span id="logo-preview" hidden>
            <img alt="Logo preview">
            <button id="logo-remove" type="button" aria-label="Remove the logo">&times;</button>
          </span>
        </div>
      </div>
    </div>

    <div id="qr" class="empty"></div>
    <button id="download" type="button" hidden>Download PNG</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"
          integrity="sha384-CHvehSuS0IW8Qj9IlAETJXbHf/SEi62VXMgODXi9p3CC3NUIuThj1Y0uAFnl30VB"
          crossorigin="anonymous"></script>
  <script src="js/qr.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
